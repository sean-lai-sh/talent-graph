# Project config-as-code. CI validates every section (`bun run check:config`).
# Scoring hyperparameters other than person_rollup, time windows, TG_* overrides,
# and claim-value settings belong in a later change (SEA-51), not here.

company_seed:
  # investors[].name: unique id.
  # investors[].aliases: other names that mean the same investor.
  # investors[].tier: 1 angel or small seed, 2 recognized institutional, 3 top-tier fund or YC.
  # investors[].source: https page that states the recorded name.
  # investors[].publishedRates: acceptance rates the source states. Empty when none is published.
  # publishedRates[].rate: fraction of applicants accepted (0.01 = 1%).
  # publishedRates[].upperBound: true when the page states a ceiling ("under 1%"), not a point.
  # publishedRates[].source: https page that states this rate.
  # publishedRates[].labels: program labels. The rate applies only when the claim text contains one.
  # companies[].name: unique id.
  # companies[].aliases: other names that mean the same company.
  # companies[].source: https page for the company entry.
  # companies[].currentStage: standing now. pre_seed_seed, series_a_b, growth_late, or public_large.
  # companies[].rounds: funding rounds.
  # rounds[].date: round date, YYYY-MM-DD. Used only when it is on or before the hire date.
  # rounds[].stage: stage at that round. Same four stages as currentStage.
  # rounds[].investors: investor names on that round.
  # rounds[].source: https page that states the round.
  # companies[].publishedRate: a company acceptance rate, or null. Same fields as an investor rate.
  # companies[].hiringBar: a map with source when a hiring-bar note exists, otherwise null.
  investors:
    - name: Y Combinator
      aliases:
        - YC
      tier: 3
      source: https://www.ycombinator.com/blog/meet-the-yc-winter-2024-batch/
      publishedRates:
        - rate: 0.01
          upperBound: true
          source: https://www.ycombinator.com/blog/meet-the-yc-winter-2024-batch/
          labels:
            - W24
            - Winter 2024
    - name: Sequoia
      aliases: []
      tier: 3
      source: https://www.sequoiacap.com/
      publishedRates: []
    - name: Andreessen Horowitz
      aliases: []
      tier: 3
      source: https://a16z.com/
      publishedRates: []
    - name: Benchmark
      aliases: []
      tier: 3
      source: https://www.benchmark.com/
      publishedRates: []
    - name: Accel
      aliases: []
      tier: 2
      source: https://www.accel.com/
      publishedRates: []
    - name: Greylock
      aliases: []
      tier: 2
      source: https://greylock.com/
      publishedRates: []
    - name: Index Ventures
      aliases: []
      tier: 2
      source: https://www.indexventures.com/
      publishedRates: []
    - name: Precursor Ventures
      aliases:
        - Precursor VC
      tier: 1
      source: https://precursorvc.com/
      publishedRates: []
    - name: Hustle Fund
      aliases: []
      tier: 1
      source: https://www.hustlefund.vc/
      publishedRates: []
  companies: []

person_rollup:
  # wTrend: weight on centered trend inside Consensus. Unitless, in [0, 1].
  wTrend: 0.2
  # wSubstance: weight on Substance inside Value. Fraction of the blend, in [0, 1].
  wSubstance: 0.6
  # wConsensus: weight on Consensus inside Value. Fraction of the blend, in [0, 1].
  wConsensus: 0.4
  # topN: strongest accepted claims averaged in each class. Count of claims.
  topN: 3
  # minCohortSize: people with Substance required before Alpha is reported. Count of people.
  minCohortSize: 30
  # minBucketSize: people required before a Consensus-bucket mean is used. Count of people. 2 is JUDGE_RELIABILITY_V2_0_0.minBucketSize.
  minBucketSize: 2
  # consensusCuts: Consensus bucket edges, walked with >=. Unitless scores in [0, 1], strictly increasing.
  consensusCuts: [0.0625, 0.25, 0.5625]
  # weightSumTolerance: allowed gap of wSubstance + wConsensus from 1. Unitless, in (0, 1e-6].
  weightSumTolerance: 1.0e-9
